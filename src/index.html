<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Reconciliation Tool</title>
    <!-- SheetJS Library -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-wrapper">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="logo">ATTENDANCE RECONCILIATION TOOL</div>
            <div class="nav-links">
                <div class="nav-item">TATA STEEL LTD</div>
            </div>
        </nav>

        <!-- Tool Section -->
        <div id="tool" class="tool-container">

            <div class="upload-grid">
                <!-- File A -->
                <div class="glass-card upload-card">
                    <div class="card-header">
                        <div class="icon-box">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
                                <polyline points="14 2 14 8 20 8" />
                            </svg>
                        </div>
                        <h3>[FILE A] : CLM Daily Report</h3>
                        <div class="card-info">
                            <h4>CLM</h4>
                        </div>
                    </div>
                    <p>Upload your .xls files downloaded from CLM here. (multifile)</p>

                    <label for="fileA" class="custom-file-upload">
                        <span>Select Files</span>
                        <input type="file" id="fileA" accept=".xls,.xlsx" multiple
                            onchange="updateFileName('fileA', 'statusA')">
                    </label>
                    <div id="statusA" class="status-text"></div>
                </div>

                <!-- File B -->
                <div class="glass-card upload-card">
                    <div class="card-header">
                        <div class="icon-box">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M21.21 15.89A10 10 0 1 1 8 2.83" />
                                <path d="M22 12A10 10 0 0 0 12 2v10z" />
                            </svg>
                        </div>
                        <h3>[FILE B] : Vendor Monthly Report</h3>
                        <div class="card-info">
                            <h4>Vendor</h4>
                        </div>
                    </div>
                    <p>Upload the vendor's .xlsx workbook here. (multisheet)</p>

                    <label for="fileB" class="custom-file-upload">
                        <span>Select File</span>
                        <input type="file" id="fileB" accept=".xlsx,.xls" onchange="updateFileName('fileB', 'statusB')">
                    </label>
                    <div id="statusB" class="status-text"></div>
                </div>

            </div>

            <!-- Action Area -->
            <div class="action-area">
                <button class="btn-primary btn-large btn-ghost" disabled onclick="processAndCompare()">
                    Run Comparison
                </button>
            </div>
        </div>
        <div class="results-container">

            <!-- Info Panel -->
            <div id="infoPanel" class="info-panel" style="display:none;"></div>

            <!-- Controls (Hidden until processed) -->
            <div id="controls" class="controls-section" style="display:none;">
                <div class="filters-bar">
                    <div class="search-wrapper">
                        <input type="text" id="searchInput" placeholder="Search by Name or Safety Pass..."
                            onkeyup="filterData()">
                    </div>
                    <div class="filter-pills">
                        <button class="pill active" onclick="setFilter('all', this)">All</button>
                        <button class="pill" onclick="setFilter('MATCH', this)">Match</button>
                        <button class="pill" onclick="setFilter('MISMATCH', this)">Mismatch</button>
                        <button class="pill" onclick="setFilter('DUPLICATE', this)">Duplicate</button>
                    </div>
                    <button class="btn-ghost" onclick="downloadReport()">Download Excel</button>
                </div>
            </div>

            <!-- Output Table -->
            <div id="output"></div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                <polyline points="22,6 12,13 2,6" />
            </svg>
            <p>alqama.hasnain@tatasteel.com</p>
            <p>FMM-INFRA</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>

</html>
