<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Reconciliation Tool</title>
    <!-- SheetJS Library -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="glass-container">
        <header>
            <h1>Attendance Reconciliation</h1>
            <p class="subtitle">Extracting Data from Daily Report (File A)</p>
        </header>

        <div class="upload-section">
            <label class="upload-card" for="fileA">
                <h3>Daily Report (File A)</h3>
                <p>Upload the .xls file containing daily report data.</p>
                <div class="file-input-wrapper">
                    <span class="btn-upload">Choose File</span>
                    <input type="file" id="fileA" accept=".xls,.xlsx" onchange="updateFileName('fileA', 'statusA')">
                </div>
                <div id="statusA" class="file-status"></div>
            </label>
        </div>

        <div class="action-area">
            <button class="btn-primary" onclick="processFiles()">Extract data from file A</button>
        </div>

        <div id="infoPanel" class="info-panel"></div>
        <div id="output"></div>
    </div>

    <script src="script.js"></script>

</body>

</html>
