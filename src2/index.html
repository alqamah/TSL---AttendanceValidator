<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Reconciliation Tool</title>
    <!-- SheetJS Library -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="glass-container">
        <header>
            <h2>Attendance Reconciliation</h2>
        </header>

        <div class="upload-section">
            <label class="upload-card" for="fileA">
                <h3>CLM Daily Report (File A)</h3>
                <p>Upload one or more .xls files (Daily Reports).</p>
                <div class="file-input-wrapper">
                    <span class="btn-upload">Choose Files</span>
                    <input type="file" id="fileA" accept=".xls,.xlsx" multiple
                        onchange="updateFileName('fileA', 'statusA')">
                </div>
                <div id="statusA" class="file-status"></div>
            </label>

            <label class="upload-card" for="fileB">
                <h3>Vendor Monthly Report (File B)</h3>
                <p>Upload the .xlsx file containing monthly data from Vendor.</p>
                <div class="file-input-wrapper">
                    <span class="btn-upload">Choose File</span>
                    <input type="file" id="fileB" accept=".xlsx,.xls" onchange="updateFileName('fileB', 'statusB')">
                </div>
                <div id="statusB" class="file-status"></div>
            </label>
        </div>

        <div class="action-area">
            <button class="btn-primary" onclick="extractFileA()">Extract data from file A</button>
            <button class="btn-primary" onclick="extractFileB()">Extract data from file B</button>
            <button class="btn-primary" onclick="compareFiles()">Compare files</button>
            <button class="btn-primary" onclick="downloadReport()">Download Report</button>
        </div>

        <div class="controls-area"
            style="margin-top: 20px; display: flex; gap: 20px; align-items: center; justify-content: center; color: white;">
            <div>
                <label for="filterStatus">Filter by Status:</label>
                <select id="filterStatus" onchange="renderTable()" style="padding: 5px; border-radius: 5px;">
                    <option value="ALL">Show All</option>
                    <option value="MATCH">Matches</option>
                    <option value="MISMATCH">Mismatches</option>
                    <option value="NOT_FOUND">Not Found in B</option>
                </select>
            </div>
            <div>
                <label style="cursor: pointer;">
                    <input type="checkbox" id="sortByName" onchange="renderTable()">
                    Sort Alphabetically
                </label>
            </div>
        </div>

        <div id="infoPanel" class="info-panel"></div>
        <div id="output"></div>
    </div>

    <script src="script.js"></script>

</body>

</html>
